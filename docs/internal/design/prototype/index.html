<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>5x1 Clickable Prototype</title>
<style>
/* Tokens from docs/internal/design-tokens.md. Light is the default; dark follows the system unless the viewer picks a theme. */
:root{
  --bg:#F8FAF7; --card:#F1F6F4; --surface:#FFFFFF; --text:#021C37; --text2:#5B6675; --line:#D9DDE3;
  --green:#09CD71; --on-green:#021C37; --orange:#FE6D09; --flame:#F84C04; --on-status:#021C37;
  --navy:#021C37; --on-navy:#F8F8F5; --dim:rgba(2,28,55,.55);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#021426; --card:#0A1725; --surface:#06233F; --text:#F8F8F5; --text2:#9AA4AF; --line:#2A4560;
    --dim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#021426; --card:#0A1725; --surface:#06233F; --text:#F8F8F5; --text2:#9AA4AF; --line:#2A4560;
  --dim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E9EDE8;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;padding:16px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body{background:#010B17} }
:root[data-theme="dark"] body{background:#010B17}
button,select,input{font-family:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font-size:24px;font-weight:700;line-height:1.25}
h3{font-size:17px;font-weight:700}
.cap{font-size:14px;color:var(--text2);line-height:1.45}
.label{font-size:13px;font-weight:600;color:var(--text2)}
.tiny{font-size:13px;color:var(--text2)}

/* Prototype controls (outside the phone) */
.bar{max-width:1040px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.bar h1{font-size:20px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:0 14px;border:0;background:var(--surface);color:var(--text);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.jump{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 10px;font-size:15px;max-width:100%}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Phone */
.stage{display:flex;justify-content:center}
.phone{position:relative;width:360px;height:740px;border-radius:32px;border:2px solid var(--line);background:var(--bg);color:var(--text);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){ body{padding:0} .bar{padding:8px} .phone{width:100%;height:100dvh;border-radius:0;border:0} }
.main{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:12px 16px 0}
.back{min-height:44px;border:0;background:transparent;color:var(--text);font-weight:600;font-size:16px;padding:0 6px 0 0;cursor:pointer}
.logo{height:30px;width:auto;display:block}
.logo-d{display:none}
:root[data-theme="dark"] .logo-l{display:none}
:root[data-theme="dark"] .logo-d{display:block}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-l{display:none} :root:not([data-theme="light"]) .logo-d{display:block} }
.logo.big{height:76px;margin:0 auto}
.crest{width:56px;height:auto;flex:none;display:block}
.navbar{display:grid;grid-template-columns:repeat(var(--tabs,4),minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding:6px 0 10px}
.navbar button{min-height:52px;border:0;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;padding:0}
.navbar button[aria-current="page"]{color:var(--text);font-weight:700;box-shadow:inset 0 3px 0 var(--green)}

/* Avatars and logos */
.avatar{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;overflow:hidden;color:var(--text)}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.teamlogo{width:56px;height:56px;border-radius:14px;background:var(--navy);color:var(--on-navy);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;overflow:hidden}
.teamlogo img{width:100%;height:100%;object-fit:cover;display:block}

/* Components */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border-radius:16px;border:2px solid transparent;font-weight:600;font-size:16px;padding:10px 14px;cursor:pointer;text-align:center;background:transparent;color:var(--text)}
.btn-primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn-outline{border-color:var(--text)}
.btn-danger{background:var(--flame);color:var(--on-status);border-color:var(--flame)}
.btn-sm{min-height:44px;width:auto;padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn-sm.outline{border-color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.chip-ok{background:var(--green);color:var(--on-green)}
.chip-wait{background:var(--orange);color:var(--on-status)}
.chip-grey{border:1px solid var(--line);color:var(--text2)}
.track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--green)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .name{flex:1;min-width:0;font-weight:600;font-size:15px}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line)}
.tabs button{min-height:44px;border:0;background:transparent;color:var(--text2);font-size:15px;font-weight:600;padding:0 0 8px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--green)}
.banner{border:2px solid var(--orange);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;gap:10px;background:var(--surface)}
.status{min-height:24px;font-size:15px;font-weight:600}
.choice-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.choice-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:600;font-size:15px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(2,28,55,.06)}
.choice-row:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.choice-row .ico{width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:700;letter-spacing:.02em}
.choice-row .lbl{display:flex;flex-direction:column;flex:1;min-width:0}
.choice-row .sub{font-size:12px;font-weight:400;color:var(--text2);margin-top:2px}
.choice-row .tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on-green)}
.choice-row .tick svg{opacity:0}
.choice-row[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.choice-row[aria-pressed="true"] .tick{background:var(--green);border-color:var(--green)}
.choice-row[aria-pressed="true"] .tick svg{opacity:1}
.date{width:56px;height:60px;border-radius:12px;background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.date b{font-size:20px;line-height:1}
.date span{font-size:11px;letter-spacing:.08em}
.event-row{display:flex;gap:12px;align-items:center;width:100%;min-height:72px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:left;cursor:pointer;font-size:15px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg3 button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;padding:4px 2px}
.seg3 button[aria-pressed="true"].present{background:var(--green);border-color:var(--green);color:var(--on-green)}
.seg3 button[aria-pressed="true"].absent{background:var(--flame);border-color:var(--flame);color:var(--on-status)}
.seg3 button[aria-pressed="true"].late{background:var(--orange);border-color:var(--orange);color:var(--on-status)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.stats .card{padding:8px 4px;gap:2px}
.footer{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.input{min-height:52px;width:100%;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px;font-size:16px}
select.input{padding-right:10px}
.toast{position:absolute;left:12px;right:12px;bottom:76px;background:var(--navy);color:var(--on-navy);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);display:none;z-index:4}
.toast.show{display:block}
.dialog-wrap{position:absolute;inset:0;background:var(--dim);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;width:100%}
</style>
</head>
<body>

<div class="bar">
  <div>
    <h1>5x1 · Clickable prototype</h1>
    <p class="cap">v0.2 · English only · Prototype data, no sign-in. Nothing is saved between visits.</p>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <label class="label" for="jump">Jump to</label>
    <select id="jump" class="jump"></select>
    <div class="seg" role="group" aria-label="Theme">
      <button type="button" data-theme-set="auto" aria-pressed="true">System</button>
      <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</div>

<div class="stage">
  <div class="phone" id="phone">
    <div id="screen" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    <div class="toast" id="toast" role="status"></div>
    <div id="layer"></div>
  </div>
</div>
<input type="file" id="photoIn" accept="image/*" hidden>

<script>
(function(){
  const LOGO = '<img class="logo logo-l" src="../../brand/5x1-logo-light.svg" alt="5x1"><img class="logo logo-d" src="../../brand/5x1-logo-dark.svg" alt="" aria-hidden="true">';
  const LOGO_BIG = LOGO.replace('class="logo logo-l"', 'class="logo big logo-l"').replace('class="logo logo-d"', 'class="logo big logo-d"');
  const CREST = '<img class="crest" src="../../assets/ivi-crest.png" alt="International Volleyball Ireland crest">';
  const POSITIONS = ['Not set','Setter','Outside hitter','Opposite','Middle blocker','Libero','Defensive specialist'];
  const ROLE_ME = {player:'João Pereira', coach:'João Pereira', admin:'Daniel Santos'};
  const MY_TEAM = 'Div 3 Dragons';

  /* ---------- State (prototype data only) ---------- */
  const S = {
    role: null,
    me: null,
    view: 'landing',
    profiles: {
      'João Pereira':  {position:'Outside hitter', photo:null, email:'joao@example.com', details:{height:'186', weight:'82', address:'12 Main Street, Dublin 8', emName:'Maria Pereira', emPhone:'+353 1 000 0000', emAddress:'4 Harbour Road, Dublin 4'}},
      'Daniel Santos': {position:'Not set', photo:null, email:'daniel@example.com'},
      'Ana Costa':     {position:'Not set', photo:null, email:'ana@example.com'}
    },
    admins: ['Daniel Santos','Ana Costa'],
    team: {name: MY_TEAM, logo: null, roster: ['Bruno Alves','Caio Mendes','Daniel Rocha','Felipe Nunes','Gustavo Lima','Hugo Teixeira','Igor Souza','João Pereira','Kleber Dias','Lucas Martins','Ethan Ferreira','Marco Silva']},
    pool: ['Otávio Braga','Nando Reis'],          // approved club members not yet on this team
    pending: ['Sofia Ribeiro','Tomás Moreira'],   // new sign-ups waiting for admin approval
    approving: {},
    approveMsg: '',
    events: [
      {id:'ev1', title:'Team training', date:'Thu 17 Oct', time:'19:00–21:00', place:'Collinstown Sports Complex', team:MY_TEAM, cap:10,
        confirmed:['Bruno Alves','Caio Mendes','Daniel Rocha','Felipe Nunes','Gustavo Lima','Hugo Teixeira','Igor Souza','João Pereira','Kleber Dias'],
        waitlist:[{name:'Lucas Martins', held:false},{name:'Ethan Ferreira', held:false}],
        maybe:['Marco Silva','Nando Reis','Otávio Braga'], att:{}, attSaved:false, mine:null, tab:'confirmed'},
      {id:'ev2', title:'League match', date:'Sun 18 Oct', time:'13:00', place:'IVI Arena', team:MY_TEAM, cap:null,
        confirmed:[], waitlist:[], maybe:['João Pereira'], att:{}, attSaved:false, mine:'maybe', tab:'confirmed'},
      {id:'ev3', title:'Technical training', date:'Thu 22 Oct', time:'19:00', place:'Collinstown Sports Complex', team:MY_TEAM, cap:null,
        confirmed:[], waitlist:[], maybe:[], att:{}, attSaved:false, mine:null, tab:'confirmed'}
    ],
    cur: 'ev1',
    removingEvent: null,
    removingRoster: null,
    dialog: null,
    rsvpMsg: '',
    eventErr: '',
    newEvent: {title:'', date:'', time:'', place:'', cap:''},
    photoTarget: null,
    setupKey: null,
    pdraft: null,
    theme: 'auto',
    lang: 'en',
    memberId: null,
    draft: {name:'', email:'', role:'player', adult:false},
    signupErr: ''
  };

  const $ = (s, r) => (r || document).querySelector(s);
  const E = () => S.events.find(e => e.id === S.cur);
  const isStaff = () => S.role === 'coach' || S.role === 'admin';
  const initials = n => n.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
  const prof = n => S.profiles[n] || (S.profiles[n] = {position:'Not set', photo:null, email:''});
  const escHtml = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  const DETAIL_KEYS = ['height','weight','address','emName','emPhone','emAddress'];
  const det = n => { const p = prof(n); if (!p.details) p.details = {}; DETAIL_KEYS.forEach(k => { if (p.details[k] === undefined) p.details[k] = ''; }); return p.details; };
  function avatar(n, cls){
    const p = prof(n);
    return '<span class="avatar ' + (cls || '') + '" aria-hidden="true">' + (p.photo ? '<img src="' + p.photo + '" alt="">' : initials(n)) + '</span>';
  }
  let toastTimer = null;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  /* ---------- Rules (docs/spec: RSVP-01, RSVP-02, ATT-01; decisions 32, 38, 39) ---------- */
  function promoteAuto(e){
    const moved = [];
    while (e.cap == null || e.confirmed.length < e.cap){
      const i = e.waitlist.findIndex(w => !w.held);           // held people are skipped
      if (i < 0) break;
      const [w] = e.waitlist.splice(i, 1);
      e.confirmed.push(w.name); moved.push(w.name);
      if (e.cap == null) break;
    }
    return moved;
  }
  function myState(e){
    if (e.confirmed.includes(S.me)) return 'going';
    const w = e.waitlist.findIndex(x => x.name === S.me);
    if (w >= 0) return 'waitlist:' + (w + 1);
    if (e.maybe.includes(S.me)) return 'maybe';
    return 'none';
  }
  function rsvp(choice){
    const e = E();
    const wasGoing = e.confirmed.includes(S.me);
    e.confirmed = e.confirmed.filter(n => n !== S.me);
    e.waitlist = e.waitlist.filter(w => w.name !== S.me);
    e.maybe = e.maybe.filter(n => n !== S.me);
    e.mine = choice;
    let msg = '';
    if (choice === 'going'){
      if (e.cap == null || e.confirmed.length < e.cap){ e.confirmed.push(S.me); msg = "You're going."; }
      else { e.waitlist.push({name:S.me, held:false}); msg = "Event is full. You're waitlist #" + e.waitlist.length + '.'; }
    } else if (choice === 'maybe'){
      e.maybe.push(S.me); msg = 'Maybe. This does not hold a place.';
    } else {
      msg = 'Not going.';
    }
    if (wasGoing && choice !== 'going'){
      const moved = promoteAuto(e);
      if (moved.length) msg += ' ' + moved.join(' and ') + (moved.length > 1 ? ' move' : ' moves') + ' up from the waitlist.';
    }
    S.rsvpMsg = msg;
  }
  function adminPromote(e, name){
    const w = e.waitlist.findIndex(x => x.name === name);
    if (w < 0) return;
    if (e.cap != null && e.confirmed.length >= e.cap){ S.dialog = {type:'raise', name, ev:e.id}; return; }
    e.waitlist.splice(w, 1); e.confirmed.push(name);
    toast(name + ' is confirmed.');
  }
  function raiseAndPromote(){
    const e = S.events.find(x => x.id === S.dialog.ev), name = S.dialog.name;
    e.cap += 1;
    const w = e.waitlist.findIndex(x => x.name === name);
    if (w >= 0){ e.waitlist.splice(w, 1); e.confirmed.push(name); }
    S.dialog = null;
    toast('Capacity raised to ' + e.cap + '. ' + name + ' is confirmed.');
  }
  function markCount(e){ return e.confirmed.filter(n => e.att[n]).length; }
  function removeFromTeam(name){
    S.team.roster = S.team.roster.filter(n => n !== name);
    S.pool.push(name); S.pool.sort();
    S.events.forEach(e => {
      e.confirmed = e.confirmed.filter(n => n !== name);
      e.waitlist = e.waitlist.filter(w => w.name !== name);
      e.maybe = e.maybe.filter(n => n !== name);
    });
  }

  /* ---------- Navigation ---------- */
  const NAV = {
    player: [['home','Home'],['events','Events'],['team','Team'],['profile','Profile']],
    coach:  [['home','Home'],['events','Events'],['team','Team'],['profile','Profile']],
    admin:  [['home','Home'],['events','Events'],['members','Members'],['club','Club'],['profile','Profile']]
  };
  function navbar(active){
    const set = NAV[S.role];
    return '<nav class="navbar" style="--tabs:' + set.length + '" aria-label="' + (S.role === 'admin' ? 'Admin' : 'Player') + ' navigation">' +
      set.map(([id, label]) => '<button type="button" data-go="' + id + '"' + (active === id ? ' aria-current="page"' : '') + '>' + label + '</button>').join('') +
      '</nav>';
  }
  function head(title, back){
    return '<div class="appbar">' + (back ? '<button class="back" type="button" data-go="' + back[0] + '">‹ ' + back[1] + '</button>' : '<span>' + LOGO + '</span>') + '<span></span></div>' +
      '<h2 tabindex="-1" id="sTitle" style="padding:0 16px">' + title + '</h2>';
  }

  /* ---------- Screens ---------- */
  function vLanding(){
    return '<div class="main" style="justify-content:flex-end;padding:24px">' +
      '<div style="flex:1"></div>' +
      '<div style="display:flex;justify-content:center">' + LOGO_BIG + '</div>' +
      '<p style="font-size:18px;text-align:center;color:var(--text2)">Your club, on the palm of your hand.</p>' +
      '<div style="height:16px"></div>' +
      '<button class="btn btn-primary" type="button" data-go="signin">Sign in</button>' +
      '<button class="btn btn-outline" type="button" data-go="signup">Create account</button>' +
      '<p class="cap" style="text-align:center">Have an invite link? Open it on this device.</p>' +
      '</div>';
  }
  function vSignin(){
    return head('Sign in', ['landing','Back']) +
      '<div class="main">' +
      '<p class="cap">Use the email you joined with.</p>' +
      '<div class="field"><label for="em">Email</label><div class="input" id="em" style="display:flex;align-items:center;color:var(--text2)">joao@example.com</div></div>' +
      '<div class="field"><label for="pw">Password</label><div class="input" id="pw" style="display:flex;align-items:center;color:var(--text2)">••••••••••</div></div>' +
      '<button class="btn" type="button" data-msg="Password reset is not in the prototype." style="justify-content:flex-start;min-height:44px;color:var(--text);text-decoration:underline;border:0;padding:0">Forgot password?</button>' +
      '<div class="card" style="background:var(--surface)"><p class="tiny"><b>Prototype only.</b> There is no real sign-in yet. Choose how you are signing in.</p>' +
      '<button class="btn btn-primary" type="button" data-role="member">Continue as player / coach</button>' +
      '<button class="btn btn-outline" type="button" data-role="admin">Continue as admin</button></div>' +
      '</div>';
  }

  function vHome(){
    if (S.role === 'admin') return vAHome();
    const e = S.events[0];
    const st = myState(e);
    const pressed = {going: st === 'going' || st.startsWith('waitlist'), maybe: st === 'maybe', not: st === 'none' && e.mine === 'not'};

  function vEvents(){
    const list = S.events.map(x => {
      const st = myState(x);

  function vEvent(){
    const e = E();
    const t = e.tab;
    let list = '';
    if (t === 'confirmed'){
      list = e.confirmed.map(n => '<div class="row">' + avatar(n) + '<span class="name">' + n + '</span><span class="chip chip-ok">Confirmed</span></div>').join('') || '<p class="cap">No one is confirmed yet.</p>';
    } else if (t === 'waitlist'){
      list = e.waitlist.map((w, i) => {
        const n = w.name;
        const removing = e.removingWL === n;
        return '<div class="card" style="margin-bottom:4px"><div style="display:flex;align-items:center;gap:12px">' + avatar(n) + '<span class="name" style="flex:1;font-weight:600">' + n + '</span><span class="chip chip-wait">Waitlist #' + (i + 1) + '</span></div>' +
          (w.held ? '<p class="tiny">On hold: skipped by automatic promotion.</p>' : '') +
          (removing
            ? '<p class="tiny">Remove ' + n + ' from the waitlist?</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn btn-danger btn-sm" type="button" data-remove-yes="' + n + '">Remove</button><button class="btn btn-outline btn-sm" type="button" data-remove-no>Keep</button></div>'
            : '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px"><button class="btn btn-primary btn-sm" type="button" data-promote="' + n + '" style="padding:8px 4px">Promote</button><button class="btn btn-outline btn-sm" type="button" data-hold="' + n + '" aria-pressed="' + w.held + '" style="padding:8px 4px">' + (w.held ? 'Release' : 'Hold') + '</button><button class="btn btn-danger btn-sm" type="button" data-remove="' + n + '" style="padding:8px 4px">Remove</button></div>') +
          '</div>';
      }).join('') || '<p class="cap">No one is on the waitlist.</p>';
    } else {
      list = e.maybe.map(n => '<div class="row">' + avatar(n) + '<span class="name">' + n + '</span><span class="chip chip-grey">Maybe</span></div>').join('') || '<p class="cap">No maybe answers.</p>';
    }
    const cap = e.cap == null ? 'No capacity limit' : e.confirmed.length + ' of ' + e.cap + ' confirmed';
    const pct = e.cap == null ? 0 : Math.min(100, Math.round(e.confirmed.length / e.cap * 100));
    return head(escHtml(e.title), ['events','Events']) + '<div class="main" style="padding-top:8px">' +
      '<p class="cap">' + escHtml(e.date) + ' · ' + escHtml(e.time) + ' · ' + escHtml(e.place) + '</p>' +
      '<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>Capacity</span><b>' + cap + '</b></div>' + (e.cap == null ? '' : '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div>') + '</div>' +
      (e.waitlist.length && e.cap != null ? '<div class="banner" role="note"><span aria-hidden="true">!</span><span>Capacity is ' + e.cap + '. New sign-ups go to the waitlist.</span></div>' : '') +
      '<div class="tabs" role="group" aria-label="List">' +
        '<button type="button" data-etab="confirmed" aria-pressed="' + (t === 'confirmed') + '">Confirmed (' + e.confirmed.length + ')</button>' +
        '<button type="button" data-etab="waitlist" aria-pressed="' + (t === 'waitlist') + '">Waitlist (' + e.waitlist.length + ')</button>' +
        '<button type="button" data-etab="maybe" aria-pressed="' + (t === 'maybe') + '">Maybe (' + e.maybe.length + ')</button>' +
      '</div>' + list + '</div>' +
      '<div class="footer"><button class="btn btn-primary" type="button" data-go="attendance">Take attendance</button>' +
        '<button class="btn btn-outline" type="button" data-msg="Reminder sent in the app.">Send in-app reminder</button></div>';
  }

      '<div id="rp-body" hidden style="display:flex;flex-direction:column;gap:10px">' +

        '</fieldset>' +

      '</form>';

        '<span class="teamlogo" aria-hidden="true">' + (t.logo ? '<img src="' + t.logo + '" alt="">' : 'D3') + '</span>' +
        '<div style="flex:1;min-width:0"><h3 style="font-size:18px">' + t.name + '</h3><p class="tiny">' + t.roster.length + ' players · IVI</p></div>' +

      (canManage ? '<button class="btn btn-outline btn-sm" type="button" data-pick-logo style="align-self:flex-start">' + (t.logo ? 'Change team logo' : 'Add team logo') + '</button>' : '') +

  function detailField(key, label, type){
    return '<div class="field"><label for="d-' + key + '">' + label + '</label><input class="input" id="d-' + key + '" data-detail="' + key + '" type="' + (type || 'text') + '" value="' + escHtml(pget(key) || '') + '" style="color:var(--text);background:var(--surface);width:100%"></div>';

  function go(view, focus){
    S.view = view; S.dialog = null; S.removingEvent = null; S.removingRoster = null; S.approveMsg = '';
    if (view !== 'profile' && view !== 'settings') S.pdraft = null;
    if (view !== 'home' && view !== 'event' && view !== 'attendance') S.rsvpMsg = '';
    if (view === 'new-event'){ S.newEvent = {title:'', date:'', time:'', place:'', cap:''}; S.eventErr = ''; }
    render(focus !== false);
    document.getElementById('screen').scrollTop = 0;

  /* ---------- Events (delegated) ---------- */
  document.addEventListener('click', function(ev){
    const el = ev.target.closest('button, [data-go]');
    if (!el) return;
    const d = el.dataset;
    if (d.themeSet) return;
    if (d.rpDate !== undefined){ el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); return; }
    if (d.setupRole){ S.draft.role = d.setupRole; refresh(); return; }
    if (d.signupContinue !== undefined){
      const dr = S.draft;
      if (!dr.name.trim()) S.signupErr = 'Enter your full name.';
      else if (!/^\S+@\S+\.\S+$/.test(dr.email)) S.signupErr = 'Enter a valid email address.';
      else if (!dr.adult) S.signupErr = 'You must be 18 or older to join for now.';
      else { S.setupKey = null; S.signupErr = ''; go('setup'); return; }
      refresh(); return;
    }
    if (d.setupFinish !== undefined){
      const name = S.draft.name.trim();
      if (!name){ S.signupErr = 'Enter your full name.'; refresh(); return; }
      const key = S.setupKey || 'New member';
      if (key !== name){ S.profiles[name] = prof(key); delete S.profiles[key]; }
      prof(name).email = S.draft.email || prof(name).email || '';
      S.me = name; S.role = S.draft.role; S.setupKey = null; S.signupErr = '';
      go('waiting'); return;
    }
    if (d.approveNew !== undefined){ go('home'); return; }
    if (d.role === 'member'){ S.draft = {name:'', email:'', role:'player', adult:true}; S.setupKey = null; S.signupErr = ''; go('setup'); return; }
    if (d.role === 'admin'){ setRole('admin'); go('home'); return; }
    if (d.member){ S.memberId = d.member; go('club-member'); return; }
    if (d.go){ go(d.go); return; }
    if (d.openEvent){
      S.cur = d.openEvent;
      if (d.then) { go(d.then); return; }
      go('event'); return;
    }
    if (d.signout !== undefined){ S.role = null; S.me = null; S.draft = {name:'', email:'', role:'player', adult:false}; S.signupErr = ''; go('landing'); return; }
    if (d.msg !== undefined){ toast(d.msg); return; }
    if (d.rsvp){ rsvp(d.rsvp); refresh(); return; }
    if (d.etab){ E().tab = d.etab; E().removingWL = null; refresh(); return; }
    if (d.promote){ adminPromote(E(), d.promote); refresh(); return; }
    if (d.hold){ const w = E().waitlist.find(x => x.name === d.hold); if (w){ w.held = !w.held; toast(w.held ? d.hold + ' is on hold.' : d.hold + ' is released.'); } refresh(); return; }
    if (d.remove){ E().removingWL = d.remove; refresh(); return; }
    if (d.removeYes){ const e = E(); e.waitlist = e.waitlist.filter(x => x.name !== d.removeYes); e.removingWL = null; toast(d.removeYes + ' removed from the waitlist.'); refresh(); return; }
    if (d.removeNo !== undefined){ E().removingWL = null; refresh(); return; }
    if (d.raiseYes !== undefined){ raiseAndPromote(); refresh(); return; }
    if (d.raiseNo !== undefined){ S.dialog = null; refresh(); return; }
    if (d.team){ const [n, t] = d.team.split('|'); const cur = S.approving[n] || []; S.approving[n] = cur.includes(t) ? cur.filter(x => x !== t) : cur.concat(t); refresh(); return; }
    if (d.approve){ const picked = S.approving[d.approve] || []; if (picked.length){ S.pending = S.pending.filter(x => x !== d.approve); S.approveMsg = d.approve + ' approved and assigned to ' + picked.join(', ') + '.'; toast(S.approveMsg); delete S.approving[d.approve]; } refresh(); return; }
    if (d.decline){ S.pending = S.pending.filter(x => x !== d.decline); S.approveMsg = 'Request declined.'; refresh(); return; }
    if (d.att){ const [n, v] = d.att.split('|'); const e = E(); e.att[n] = e.att[n] === v ? undefined : v; e.attSaved = false; refresh(); return; }
    if (d.save !== undefined){ const e = E(); e.attSaved = true; toast('Attendance saved for ' + markCount(e) + ' players.'); refresh(); return; }
    if (d.rosterAdd){ S.pool = S.pool.filter(x => x !== d.rosterAdd); S.team.roster.push(d.rosterAdd); toast(d.rosterAdd + ' added to ' + S.team.name + '.'); refresh(); return; }
    if (d.rosterRemove){ S.removingRoster = d.rosterRemove; refresh(); return; }
    if (d.rosterRemoveYes){ const n = d.rosterRemoveYes; removeFromTeam(n); S.removingRoster = null; toast(n + ' removed from ' + S.team.name + '.'); refresh(); return; }
    if (d.rosterRemoveNo !== undefined){ S.removingRoster = null; refresh(); return; }
    if (d.photoMenu){ S.dialog = {type:'photo', name:d.photoMenu}; refresh(); return; }
    if (d.profileSave !== undefined){
      const dr = S.pdraft || {};
      Object.keys(dr).forEach(k => { if (k === 'position') prof(S.me).position = dr[k]; else det(S.me)[k] = dr[k]; });
      S.pdraft = null; toast('Profile saved.'); refresh(); return;
    }
    if (d.themePick){ setTheme(d.themePick); refresh(); return; }
    if (d.langPick){ S.lang = d.langPick; toast(d.langPick === 'pt-BR' ? 'Português is planned. Screens stay in English for now.' : 'Language: English.'); refresh(); return; }
    if (d.photoCancel !== undefined){ S.dialog = null; refresh(); return; }
    if (d.pickPhoto){ S.dialog = null; S.photoTarget = d.pickPhoto; document.getElementById('photoIn').click(); return; }
    if (d.removePhoto){ prof(d.removePhoto).photo = null; S.dialog = null; toast('Photo removed.'); refresh(); return; }
    if (d.pickLogo !== undefined){ S.photoTarget = 'team'; document.getElementById('photoIn').click(); return; }
  });

  document.addEventListener('change', function(ev){
    const t = ev.target;

    if (t.dataset && t.dataset.detail){ det(S.me)[t.dataset.detail] = t.value; toast('Saved.'); refresh(); return; }

  document.addEventListener('change', function(ev){
    if (ev.target.id === 'rp-on'){ document.getElementById('rp-body').hidden = !ev.target.checked; return; }
    if (ev.target.name === 'rp-pattern'){ const dates = ev.target.value === 'dates'; document.getElementById('rp-weekly').hidden = dates; document.getElementById('rp-dates').hidden = !dates; }
  });

  document.addEventListener('submit', function(ev){
    if (ev.target.id !== 'newEventForm') return;
    ev.preventDefault();
    const f = new FormData(ev.target);
    const v = {title:(f.get('title')||'').trim(), date:(f.get('date')||'').trim(), time:(f.get('time')||'').trim(), place:(f.get('place')||'').trim(), cap:(f.get('cap')||'').trim()};
    S.newEvent = v;
    const missing = ['title','date','time','place'].filter(k => !v[k]);
    if (missing.length){ S.eventErr = 'Fill in ' + missing.join(', ') + ' to continue.'; refresh(); return; }
    if (v.cap && !/^\d+$/.test(v.cap)){ S.eventErr = 'Capacity must be a whole number, or leave it blank.'; refresh(); return; }
    const id = 'ev' + (S.events.length + 1);
    S.events.push({id, title:v.title, date:v.date, time:v.time, place:v.place, team:MY_TEAM, cap: v.cap ? parseInt(v.cap, 10) : null,
      confirmed:[], waitlist:[], maybe:[], att:{}, attSaved:false, mine:null, tab:'confirmed'});
    S.cur = id; S.eventErr = '';
    const repeatOn = document.getElementById('rp-on') && document.getElementById('rp-on').checked;
    toast(repeatOn ? 'Prototype: one event created. Repeating events are v2.' : 'Event created. RSVP deadline: 2 hours before the start.');
    go('event');
  });

  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && S.dialog){ S.dialog = null; refresh(); } });

  document.getElementById('jump').addEventListener('change', function(ev){
    const o = jumpOptions().find(x => x[0] === ev.target.value);
    if (!o) return;
    if (o[2]) setRole(o[2]);
    else { S.role = null; S.me = null; }
    go(o[3]);
  });

  /* ---------- Theme ---------- */
  function setTheme(v){
    S.theme = v;
    if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v);
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === v)));
  }
  document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeSet)));

  S.view = 'landing';
  render(false);
})();
</script>
</body>
</html>
