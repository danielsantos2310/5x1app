<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5x1 — Product Spec &amp; Roadmap</title>
  <style>
    :root { color-scheme: light dark; --max: 52rem; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; background: Canvas; color: CanvasText; }
    main { max-width: var(--max); margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.95rem; display: block; overflow-x: auto; }
    th, td { border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    th { font-weight: 600; }
    a { color: LinkText; }
    code { font-family: ui-monospace, monospace; }
    :focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
    #status { color: GrayText; }
  </style>
</head>
<body>
  <nav aria-label="Spec files" style="max-width:52rem;margin:0 auto;padding:1rem 1.25rem 0;font-size:0.95rem;">
    <strong>Full spec package:</strong>
    <a href="spec/00-README.md">Overview</a> ·
    <a href="spec/01-PRD.md">PRD</a> ·
    <a href="spec/02-TRD.md">TRD</a> ·
    <a href="spec/03-FLOWS.md">Flows</a> ·
    <a href="spec/04-DESIGN.md">Design</a> ·
    <a href="spec/05-PLAN.md">Plan</a> ·
    <a href="spec/06-BACKEND.md">Backend</a> ·
    <a href="spec/07-TESTING.md">Testing</a> ·
    <a href="spec/08-SECURITY-PRIVACY.md">Security and privacy</a>
  </nav>
  <main id="content">
    <p id="status" role="status">Loading the spec…</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    (async () => {
      const out = document.getElementById("content");
      const status = document.getElementById("status");
      try {
        const res = await fetch("product-spec.md", { cache: "no-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const md = await res.text();
        out.innerHTML = marked.parse(md);
        document.title = "5x1 — Product Spec & Roadmap";
      } catch (err) {
        status.textContent = "The spec could not be loaded. Please try again later.";
      }
    })();
  </script>
</body>
</html>
